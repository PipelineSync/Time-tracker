# Keep the web app's dependencies and CI actions current.
#
# Note: dependency bumps land as PRs — review them before merging. The
# interesting majors to watch (currently blocked by peer deps, safe minors
# are fine to auto-merge by hand):
#   - vite 5 → 6+ (needs a matching vite-plugin-pwa)
#   - react-router-dom 6 → 7 (open-redirect CVE fixed in 7.18+)
#   - @capacitor/* minor bumps
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    groups:
      # Cap packages (core + cli + per-OS) bump together; keep them in one
      # PR so versions never drift apart.
      capacitor:
        patterns:
          - '@capacitor/*'
    ignore:
      # Major bumps need manual testing — don't re-propose them every week.
      # sonner 2.x / date-fns 4.x change runtime behavior; @eslint/js 10
      # currently breaks `npm ci` (peer conflict). Revisit by hand.
      - dependency-name: "sonner"
        update-types: ["version-update:semver-major"]
      - dependency-name: "date-fns"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [ci]
