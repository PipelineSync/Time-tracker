name: Chrome extension

on:
  push:
    branches: [main]
    paths:
      - extension/**
      - .github/workflows/extension.yml
  pull_request:
    paths:
      - extension/**
      - .github/workflows/extension.yml
  workflow_dispatch:

concurrency:
  group: extension-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, build & verify the extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Runs the whole shift (sign in → clock in → break → clock out) against
      # the mock Supabase in scripts/mock-supabase.mjs. No secrets needed.
      - name: Verify the clock flow
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Verify the packaged build
        run: npm run verify:build

      - name: Package for the Chrome Web Store
        run: npm run zip

      - name: Upload the packaged extension
        uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: extension/releases/*.zip
          retention-days: 14
