[package]
name = "pipelinesync-work-tracker"
version = "1.0.0"
description = "PipelineSync Work Tracker — desktop app (Windows / macOS / Linux)"
authors = ["PipelineSync"]
edition = "2021"
rust-version = "1.77.2"

# The library crate is what Tauri links; the binary crate is a thin launcher.
[lib]
name = "pipelinesync_work_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Smaller, faster release binaries for the shipped installers.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
