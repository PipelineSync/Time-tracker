<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/pipelinesync-icon.png" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <!-- viewport-fit=cover lets the app paint edge-to-edge on notched
         iPhones; the layout then pads itself with env(safe-area-inset-*). -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#06245B" />

    <!-- Install-as-app metadata (iOS / iPadOS home screen) -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PipelineSync" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <meta
      name="description"
      content="PipelineSync Work Tracker — track worker hours, breaks, notes and payments on web, iPhone, Android and desktop."
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>PipelineSync — Work Tracker</title>
    <script>
      // Apply the saved theme before first paint so installed apps and dark
      // mode never flash white on launch.
      ;(function () {
        try {
          var stored = localStorage.getItem('wt_theme')
          var dark =
            stored === 'dark' ||
            (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add(dark ? 'dark' : 'light')
        } catch (e) {
          /* private mode: default to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
